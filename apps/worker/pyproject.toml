[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sensemu-worker"
version = "0.1.0"
description = "SenseMu asynchronous job worker"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.40,<2",
  "celery[redis]>=5.5,<6",
  "docker>=7.1,<8",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/sensemu_worker"]

[tool.ruff]
line-length = 100
target-version = "py312"
