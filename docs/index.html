<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="SenseMu 图像算法生产、训练、发布与交易平台的在线预览入口。"
    />
    <title>SenseMu 项目入口</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: #14181f;
        background: #f4f5f7;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 18% 12%, #e7f7f2 0, transparent 36%),
          radial-gradient(circle at 85% 18%, #eceafb 0, transparent 34%),
          #f4f5f7;
      }

      main {
        width: min(680px, 100%);
        padding: clamp(32px, 7vw, 64px);
        border: 1px solid rgba(20, 24, 31, 0.09);
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 24px 70px rgba(32, 38, 48, 0.08);
      }

      .mark {
        display: inline-grid;
        width: 48px;
        height: 48px;
        place-items: center;
        border-radius: 15px;
        color: #fff;
        background: #14181f;
        font-weight: 700;
        letter-spacing: -0.04em;
      }

      h1 {
        margin: 28px 0 12px;
        font-size: clamp(36px, 8vw, 58px);
        line-height: 1.04;
        letter-spacing: -0.055em;
      }

      p {
        margin: 0;
        max-width: 560px;
        color: #626974;
        font-size: 17px;
        line-height: 1.75;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 32px;
      }

      a {
        min-height: 46px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 20px;
        border: 1px solid #d9dde3;
        border-radius: 13px;
        color: #14181f;
        background: #fff;
        font-weight: 600;
        text-decoration: none;
      }

      a.primary {
        border-color: #14181f;
        color: #fff;
        background: #14181f;
      }

      a:focus-visible {
        outline: 3px solid rgba(56, 132, 255, 0.35);
        outline-offset: 3px;
      }

      small {
        display: block;
        margin-top: 24px;
        color: #8a9099;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="mark" aria-hidden="true">SE</span>
      <h1>SenseMu</h1>
      <p>
        面向图像算法的数据准备、训练、发布与交易平台。生产预览由 Cloudflare Workers 承载，公开地址以最新部署详情为准。
      </p>
      <nav aria-label="SenseMu 链接">
        <a
          class="primary"
          href="https://github.com/ericzr/sense-mu/blob/main/docs/CLOUDFLARE_DEPLOYMENT.md"
          >查看 Cloudflare 部署</a
        >
        <a href="https://github.com/ericzr/sense-mu">查看源代码</a>
      </nav>
      <small>GitHub Pages 仅提供项目入口，不承载完整工作台；真实训练、数据写入和推理能力仍需要后端运行环境。</small>
    </main>
  </body>
</html>
